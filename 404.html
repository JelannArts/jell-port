<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Jelann Arts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#0C0D0B;--ink:#F5F3EC;--ink-soft:#9C9A90;--line:#2A2B25;--surface:#17181A;--accent:#C6A15B}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% 38%,rgba(198,161,91,.14),transparent 62%)}
main{max-width:640px;width:100%}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:26px}
/* the "missing logo" frame */
.frame{position:relative;border:2px dashed var(--line);border-radius:6px;padding:46px 20px 38px;background:var(--surface)}
.frame::before,.frame::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--accent)}
.frame::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.frame::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.cap{position:absolute;top:12px;left:16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
/* chunky game-logo 404 */
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-style:italic;font-size:clamp(88px,22vw,170px);line-height:.9;letter-spacing:-.02em;color:var(--accent);display:flex;justify-content:center;gap:.02em;user-select:none;
  text-shadow:0 2px 0 #8d6f33,0 4px 0 #7a5f2b,0 6px 0 #684f24,0 8px 0 #563f1d,0 14px 28px rgba(0,0,0,.6)}
.logo button{display:inline-block;cursor:pointer;transform:skewX(-6deg);transition:transform .25s;background:none;border:0;padding:0 .02em;font:inherit;font-style:inherit;color:inherit;text-shadow:inherit;letter-spacing:inherit;line-height:inherit}
.logo button:hover{transform:skewX(-6deg) translateY(-8px) rotate(-4deg)}
.logo .o{color:var(--ink);text-shadow:0 2px 0 #b9b6aa,0 4px 0 #95928a,0 6px 0 #6f6d66,0 8px 0 #4a4944,0 14px 28px rgba(0,0,0,.6)}
.logo .hit{animation:pop .5s}
@keyframes pop{30%{transform:skewX(-6deg) scale(1.25) rotate(-8deg)}100%{transform:skewX(-6deg)}}
.err{margin-top:22px;font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:clamp(20px,4vw,28px)}
.sub{margin-top:12px;color:var(--ink-soft);font-size:16px;line-height:1.6;max-width:44ch;margin-inline:auto}
.sub b{color:var(--ink);font-weight:500}
.actions{margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 26px;border-radius:3px;font-weight:600;font-size:14px;text-decoration:none;transition:transform .2s,background .2s,border-color .2s}
.btn-primary{background:var(--accent);color:var(--paper)}
.btn-primary:hover{transform:translateY(-2px);background:#d8b36b}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent);transform:translateY(-2px)}
.hint{margin-top:30px;font-size:12px;color:var(--ink-soft);min-height:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="tag">Jelann Arts</div>
  <div class="frame">
    <div class="cap">Logo not found</div>
    <div class="logo" id="logo" role="group" aria-label="Error 404"><button type="button">4</button><button type="button" class="o">0</button><button type="button">4</button></div>
  </div>
  <h1 class="err">This level doesn't exist.</h1>
  <p class="sub">The page you were after is missing, moved, or never made it past the concept stage. <b>The good news:</b> the logos are all still here.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">Back to home</a>
    <a class="btn btn-ghost" href="/#work">See the work</a>
  </div>
  <p class="hint" id="hint" aria-live="polite">Psst. Try clicking the logo.</p>
</main>
<script>
(function(){
  var spans=document.querySelectorAll('#logo button'),hint=document.getElementById('hint'),n=0;
  var lines=['Nice. Still a 404.','Revision 1 requested.','Revision 2 requested.','That was your last included revision.','A new direction needs a new quote.'];
  spans.forEach(function(s){s.addEventListener('click',function(){
    s.classList.remove('hit');void s.offsetWidth;s.classList.add('hit');
    hint.textContent=lines[Math.min(n++,lines.length-1)];
  });});
})();
</script>
</body>
</html>
